# Local development database ONLY. Production is Supabase — see
# docs/ARCHITECTURE.md §10. This gives a real Postgres to develop and run
# migrations against without touching the real Supabase project for every
# schema change, and without paying for a dev-tier Supabase branch.
#
# Postgres 18 specifically, matching what packages/db/schema/_columns.ts
# assumes for native uuidv7() — see the schema-conventions note in
# ARCHITECTURE.md §5 about Supabase's own Postgres version lagging behind
# (covered by the uuidv7() shim in the meantime).
#
# Run via the root scripts: `pnpm db:up` / `pnpm db:down` / `pnpm db:nuke`.
# Reads .env.local, not .env.production — see CLAUDE.md → "Environment
# files". POSTGRES_PASSWORD here must stay a distinct, local-only value,
# never the Supabase database password.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: summerice
      POSTGRES_DB: summerice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.local.example}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summerice -d summerice"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
